[project]
name = "advent-of-code-hhoppe"
description = "Library for Advent of Code -- Hugues Hoppe."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hugues Hoppe", email="hhoppe@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["advent-of-code", "aoc", "puzzles", "jupyter", "notebook", "timing"]

# The pip dependencies of the project.
# The lower bounds pass the tests under Python 3.10; CI tests them.  (advent-of-code-data 2.1.1
# is the first version to treat day 12 as the final day of the 12-day puzzle years from 2025.)
dependencies = [
    "advent-of-code-data>=2.1.1",
    "IPython>=5.0",
]

# Flit sets the version from `advent_of_code_hhoppe.__version__`.
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/hhoppe/advent-of-code-hhoppe"
repository = "https://github.com/hhoppe/advent-of-code-hhoppe"
changelog = "https://github.com/hhoppe/advent-of-code-hhoppe/releases"

# Development requirements (PEP 735), which are not part of the published package metadata.
# CI installs them with `pip install . --group test` or `pip install . --group lint`.
[dependency-groups]
test = ["pytest"]
lint = [
    "mypy", "pyink", "pylint", "pyrefly", "ruff",
    {include-group = "test"},  # So that the checkers can resolve the imports of the tests.
]

[build-system]
requires = ["flit_core >=3.12,<4"]  # For PEP 639 `license`.
build-backend = "flit_core.buildapi"

[tool.autopep8]
indent_size = 2
ignore = "E111,E114,E121,E125,E126,E129,E226,E302,E305,E501,W504,E741,E20,W503,E731"
aggressive = 3
recursive = true
exclude = ".ipynb_checkpoints"

[tool.mypy]
ignore_missing_imports = true
strict = true
files = ["."]

[tool.pyink]
target-version = ["py310"]  # Else inferred from `requires-python` as py310..py315.
pyink-indentation = 2
line-length = 100  # Default is 88.
pyink-use-majority-quotes = true
extend-exclude = "\\.ipynb$"

[tool.pylint.main]
disable = [
    "fixme", "redefined-builtin", "cell-var-from-loop",
    "using-constant-test", "simplifiable-condition", "import-outside-toplevel", "line-too-long",
    "too-many-lines", "too-few-public-methods", "too-many-arguments", "too-many-locals",
    "use-dict-literal", "unnecessary-lambda-assignment",
]
reports = false
score = false
recursive = true
ignore-paths = [".*ipynb_checkpoints"]

[tool.pylint.basic]
good-names-rgxs = "^([a-z][a-z0-9]?|[A-Z]([A-Z_]*[A-Z])?)$"

[tool.pylint.format]
indent-string = "  "
expected-line-ending-format = "LF"

[tool.pyrefly]
min-severity = "warn"
project-includes = ["**/*.py"]

[tool.pytest.ini_options]
addopts = ["--doctest-modules", "--ignore-glob=*.#*"]  # (Emacs lock files end in ".py".)
testpaths = ["advent_of_code_hhoppe", "test_advent_of_code_hhoppe.py"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "B", "C", "UP", "SIM", "RUF", "NPY", "PTH", "PERF",
    "ISC", "ICN", "PIE", "RET", "TID", "TC", "I",
]
extend-ignore = [
    "E402", "E501", "E721", "E741",
    "B010", "B028", "C408", "C901",
    "TC003", "TC006", "SIM300", "ICN001", "RET504", "SIM905", "RUF005",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?)|unused_.*)$"
