[project]
name = "advent-of-code-hhoppe"
description = "Library for Advent of Code -- Hugues Hoppe."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Hugues Hoppe", email="hhoppe@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = []

# pip dependencies of the project
# The lower bounds are the oldest versions that pass the tests under Python 3.10; CI tests them.
# (Older advent-of-code-data imports pkg_resources without declaring a dependency on setuptools.)
dependencies = [
    "advent-of-code-data>=2.0.0",
    "IPython>=5.0",
]

# This is set automatically by flit using `*.__version__`
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/hhoppe/advent-of-code-hhoppe"
repository = "https://github.com/hhoppe/advent-of-code-hhoppe"
# Other: `documentation`, `changelog`

# Development requirements (PEP 735), which are not part of the published package metadata.
# CI installs them with `pip install . --group test` or `pip install . --group lint`.
[dependency-groups]
test = ["pytest"]
lint = [
    "mypy", "pyink", "pylint", "pyrefly", "ruff",
]

[build-system]
requires = ["flit_core >=3.5,<4"]
build-backend = "flit_core.buildapi"

[tool.autopep8]
indent_size = 2
ignore = "E111,E114,E121,E125,E126,E129,E226,E302,E305,E501,W504,E741,E20,W503,E731"
aggressive = 3
recursive = true
exclude = "*.ipynb_checkpoints"

[tool.mypy]
ignore_missing_imports = true
strict = true
files = ["."]

[tool.pyink]
target-version = ["py310"]  # Else inferred from `requires-python` as py310..py315.
pyink-indentation = 2
line-length = 100  # Default is 88.
pyink-use-majority-quotes = true
extend-exclude = "\\.ipynb$"

[tool.pylint.main]
disable = [
    "fixme", "redefined-builtin", "cell-var-from-loop",
    "using-constant-test", "simplifiable-condition", "import-outside-toplevel", "line-too-long",
    "too-many-lines", "too-few-public-methods", "too-many-arguments", "too-many-locals",
    "use-dict-literal", "unnecessary-lambda-assignment",
]
reports = false
score = false
recursive = true
ignore-paths = [".*ipynb_checkpoints"]

[tool.pylint.basic]
good-names-rgxs = "^[a-z][a-z0-9]?|[A-Z]([A-Z_]*[A-Z])?$"

[tool.pylint.format]
indent-string = "  "
expected-line-ending-format = "LF"

[tool.pyrefly]
min-severity = "warn"
project-excludes = ["*.ipynb"]

[tool.pytest.ini_options]
addopts = "--ignore-glob '*.#*' --doctest-modules"

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "B", "C", "UP", "SIM", "RUF", "NPY", "PTH", "PERF",
    "ISC", "ICN", "PIE", "RET", "TID", "TC", "I",
]
extend-ignore = [
    "E402", "E501", "E721", "E741",
    "B010", "B028", "C408", "C901",
    "TC003", "TC006", "SIM300", "ICN001", "RET504", "SIM905", "RUF005",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?)|unused_.*)$"
