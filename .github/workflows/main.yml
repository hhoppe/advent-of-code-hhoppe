name: Build, test, and publish Python distributions to PyPI

# My strategy is test, build, and publish on all push events to main.  The publish step skips the
# upload if PyPI already has this version, so a release happens when __version__ is bumped.
# Publishing uses PyPI Trusted Publishing (OIDC), so no API token is stored in the repository.

on:
  push:
    branches: [main]
    # tags: "v*.*.*"  # Tag push is not associated with a branch, so OR this.
  pull_request:
    branches: [main]
  schedule:
    # Also detect breakage from new releases of Python, the dependencies, and the lint tools.
    - cron: '0 11 * * 0'  # Weekly on Sunday at 11:00 UTC.
  workflow_dispatch:

# Security: restrict permissions for CI jobs.
permissions:
  contents: read

concurrency:
  # Include the event, so that a push does not cancel a scheduled run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate code
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false  # Report the results for every configuration.
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.x']
        include:
          - os: windows-latest
            python-version: '3.x'
          - os: macos-latest
            python-version: '3.x'
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the package and the test requirements
      run: pip install . --group test

    - name: Run tests including doctest
      run: pytest  # The options, including --doctest-modules, are in pyproject.toml.

  test-min:
    name: Test with the minimum dependency versions (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install uv, whose resolver can select the lowest allowed versions
      run: pip install uv

    - name: Install the package and the test requirements, with the dependencies at their lower bounds
      run: |
        uv pip compile pyproject.toml --python-version 3.10 --resolution lowest-direct -o min.txt
        cat min.txt
        uv pip install --system . --group test -c min.txt

    - name: Run tests including doctest
      run: pytest

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        # Not '3.x', which becomes 3.15 in October 2026: pylint's parallel mode (-j) fails on it
        # (dill 0.4.1 reads the removed co_lnotab; dill's main branch has the fix).
        # Return to '3.x' once a dill release supports 3.15.
        python-version: '3.14'

    - name: Install the package, the lint tools, and the optional imports
      run: pip install . --group lint

    - name: Run pyink
      run: pyink --check --diff .

    - name: Run ruff
      run: ruff check .

    - name: Run mypy
      run: mypy

    - name: Run pyrefly
      run: pyrefly check

    - name: Run pylint
      run: pylint -j0 .

  publish:
    name: Publish to PyPI
    # if: github.repository == 'hhoppe/some_repo'
    # if: startsWith(github.ref, 'refs/tags/v')
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate  # Not lint, so that a new release of a lint tool cannot block publishing.
    environment: pypi
    permissions:
      contents: write  # Required to create the release tag.
      id-token: write  # Required for Trusted Publishing.
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # The full history and tags, for the release notes.

    - name: Set up Python 3.x
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Build a binary wheel and a source tarball
      run: |
        python -m pip install build --user
        python -m build --sdist --wheel --outdir dist/ .

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true  # Succeed without uploading if PyPI already has this version.

    - name: Create a GitHub release, with tag v<version> and the commits as notes, for a new version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(basename dist/*.tar.gz .tar.gz)  # The sdist is <name>-<version>.tar.gz.
        tag=v${version##*-}
        if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
          echo "Tag $tag already exists."
        else
          prev=$(git describe --tags --abbrev=0 HEAD)  # The previous release, since HEAD is untagged.
          {
            git log --format='- %s (%h)' "$prev..HEAD"
            echo
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$tag"
          } >release_notes.md
          cat release_notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release_notes.md
        fi
